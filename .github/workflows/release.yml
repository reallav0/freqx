name: Desktop release
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'package*.json'
      - 'runtime/**'
      - 'audio/**'
      - 'assets/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'logo.*'
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  checks:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    uses: ./.github/workflows/ci.yml
  version:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: version
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/release-version.cjs
  build:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check whether this release is already published
        id: existing
        shell: pwsh
        run: |
          $json = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          $published = $LASTEXITCODE -eq 0 -and -not ($json | ConvertFrom-Json).isDraft
          "published=$($published.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - if: steps.existing.outputs.published != 'true'
        run: npm ci
      - if: steps.existing.outputs.published != 'true'
        run: npm run dist
      - name: SBOM and checksums
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: |
          npm sbom --sbom-format=cyclonedx --omit=dev | Set-Content -Encoding utf8 dist/SBOM.cdx.json
          if ($LASTEXITCODE -ne 0) { throw 'SBOM generation failed.' }
          node scripts/release-artifacts.cjs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.existing.outputs.published != 'true' && !github.event.repository.private
        with:
          subject-path: |
            dist/FreqX-*.exe
            dist/latest.yml
            dist/SBOM.cdx.json
            dist/SHA256SUMS.txt
      - name: Publish complete release
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --generate-notes --title "FreqX $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $artifacts = Get-ChildItem dist -File | Where-Object { $_.Name -match '^(FreqX-.*\.exe(\.blockmap)?|latest\.yml|SBOM\.cdx\.json|SHA256SUMS\.txt)$' } | Select-Object -ExpandProperty FullName
          gh release upload $env:RELEASE_TAG @artifacts --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
