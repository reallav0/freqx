name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:auth-desktop
      - run: npm run test:recovery
      - run: npm run test:driver
      - run: npm run test:voice-security
      - run: npm run test:mic-isolation
      - run: npm run test:echo
      - run: npm run test:reference-desktop
      - run: npm run test:public-library
      - run: npm audit --audit-level=high
      - name: Packaging validation
        run: npm run pack
      - name: Production packaged startup regression
        run: node tests/packaged-startup.cjs
      - name: Packaged Discover regression
        run: node tests/discover-library.cjs --app-root dist/win-unpacked/resources/app.asar
      - name: Packaged microphone regression
        run: node tests/mic-isolation.cjs --app-root dist/win-unpacked/resources/app.asar
      - name: Packaged voice security regression
        run: node tests/voice-isolation-security.cjs --app-root dist/win-unpacked/resources/app.asar
      - name: Packaged playback reference regression
        run: node tests/playback-reference-desktop.cjs --app-root dist/win-unpacked/resources/app.asar
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks history and working tree
        shell: bash
        run: |
          curl --fail --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb /tmp/gitleaks.tar.gz | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
          /tmp/gitleaks dir --redact --no-banner
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install semgrep==1.178.0
      - name: Focused SAST
        run: semgrep scan --config security/semgrep.yml --error --metrics=off
